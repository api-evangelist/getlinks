name: Getlinks
description: 'GetLinks is an AI-powered hiring operating system for Southeast Asia, operating
  across Thailand, Singapore, and Vietnam. For employers it provides job posting, AI-driven
  candidate screening, structured interview tooling with video/audio scoring, and recruiter
  consulting services; for job seekers it offers job search (14,200+ active jobs in Thailand),
  salary intelligence sourced from real placements, AI CV readiness analysis, and mock interview
  training. Backed by 500 Global. No public developer API, SDK, or developer portal was found;
  the platform is an end-user recruitment and career product.'
